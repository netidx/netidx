[package]
name = "netidx-tools"
version = "0.32.0"
authors = ["Eric Stokes <letaris@gmail.com>"]
edition = "2024"
license = "MIT"
description = "netidx command line tools"
homepage = "https://netidx.github.io/netidx-book/"
repository = "https://github.com/estokes/netidx"
readme = "../README.md"
documentation = "https://docs.rs/netidx"
keywords = ["networking", "distributed", "kerberos", "tool"]
categories = ["network-programming"]

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false

[[bin]]
name = "netidx"
path = "src/main.rs"

# The Windows background activation supervisor. On Windows it is a GUI-subsystem
# binary (no console window — see the file header) that the per-user logon
# Scheduled Task launches. Declared on every platform only because Cargo can't
# build a binary for one OS (cargo#3138/#9208) and `cargo install netidx-tools`
# must drop netidx-activation.exe next to netidx.exe on Windows for `netidx conf
# workstation install` to register the logon task. On unix it is an inert stub
# (the supervisor runs in-process via `netidx activation`).
[[bin]]
name = "netidx-activation"
path = "src/bin/netidx-activation.rs"

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
default = []
krb5_iov = ["netidx/krb5_iov"]

[dependencies]
anyhow = { workspace = true }
arcstr = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
combine = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
escaping = { workspace = true }
futures = { workspace = true }
nohash = { workspace = true }
ahash = { workspace = true }
poolshark = { workspace = true }
graphix-shell = { workspace = true }
graphix-rt = { workspace = true }
graphix-compiler = { workspace = true }
graphix-package = { workspace = true }
hdrhistogram = { workspace = true }
log = { workspace = true }
netidx-activation = { path = "../netidx-activation", version = "0.32.0" }
netidx-admin = { path = "../netidx-admin", version = "0.32.0", features = ["cloud-detect"] }
netidx-id-map = { path = "../netidx-id-map", version = "0.32.0" }
netidx-tpm = { path = "../netidx-tpm", version = "0.32.0" }
netidx-archive = { path = "../netidx-archive", version = "0.32.0", default-features = false }
netidx-container = { path = "../netidx-container", version = "0.32.0", default-features = false }
netidx = { path = "../netidx", version = "0.32.0", default-features = false }
netidx-protocols = { path = "../netidx-protocols", version = "0.32.0", default-features = false }
netidx-tools-core = { path = "../netidx-tools-core", version = "0.32.0", default-features = false }
netidx-wsproxy = { path = "../netidx-wsproxy", version = "0.32.0", default-features = false }
enumflags2 = { workspace = true }
# File-watching for live reload (resolver-server config + perms;
# `netidx-id-map` uses the same crate for the same reason).
extended-notify = { workspace = true }
parking_lot = { workspace = true }
rpassword = { workspace = true }
serde_derive = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
triomphe = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
humantime = { workspace = true }

[dev-dependencies]
graphix-package-core = { workspace = true }
netidx-derive = { path = "../netidx-derive", version = "0.32.0" }
netidx-value = { path = "../netidx-value", version = "0.32.0" }
