[package]
name = "netidx-admin-proto"
version = "0.32.0"
authors = ["Eric Stokes <letaris@gmail.com>"]
edition = "2024"
license = "MIT"
description = "netidx administrative protocol and data model"
homepage = "https://netidx.github.io/netidx-book/"
repository = "https://github.com/estokes/netidx"
readme = "../README.md"
documentation = "https://docs.rs/netidx-admin-proto"
keywords = ["networking", "distributed", "configuration"]
categories = ["network-programming"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
enumflags2 = { workspace = true }
humantime-serde = { workspace = true }
netidx = { path = "../netidx", version = "0.32.0", default-features = false }
netidx-activation = { path = "../netidx-activation", version = "0.32.0" }
netidx-core = { path = "../netidx-core", version = "0.32.0" }
netidx-derive = { path = "../netidx-derive", version = "0.32.0" }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true, features = ["verify"] }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true, features = ["x509-parser"] }
serde_json = { workspace = true }
