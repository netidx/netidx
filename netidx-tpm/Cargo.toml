[package]
name = "netidx-tpm"
version = "0.32.0"
authors = ["Eric Stokes <letaris@gmail.com>"]
edition = "2024"
license = "MIT"
description = "netidx hardware sealing — bind small secrets (key passwords, credentials) to the host TPM 2.0 or macOS Secure Enclave"
homepage = "https://netidx.github.io/netidx-book/"
repository = "https://github.com/estokes/netidx"
readme = "../README.md"
documentation = "https://docs.rs/netidx-tpm"
keywords = ["networking", "distributed", "security", "tpm"]
categories = ["network-programming", "cryptography"]

[dependencies]
anyhow = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
# Pure-Rust TPM 2.0 marshalling (Jarkko Sakkinen, the kernel TPM
# subsystem maintainer). Pinned exactly: pre-1.0, the API still moves.
# Everywhere except macOS, which has no TPM — sealing there goes
# through the Secure Enclave instead (below).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tpm2-protocol = { workspace = true }
# Encrypts a secret too large for one TPM sealed object under a key the
# TPM does hold — see `MAGIC_ENVELOPED`.
aes-gcm = { workspace = true }

# TPM Base Services (tbs.dll) — the Windows TPM resource manager.
# raw-dylib linkage: no import libraries, cross-compiles from linux.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_TpmBaseServices"] }

# macOS has no TPM; sealing goes through the Secure Enclave via
# Security.framework (pure-Rust bindings, OS frameworks only).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
security-framework = { workspace = true }
security-framework-sys = { workspace = true }
