[package]
name = "graphix-package-netidx-admin"
version = "0.32.0"
authors = ["Eric Stokes <letaris@gmail.com>"]
edition = "2024"
license = "MIT"
description = "netidx administration from Graphix: the admin-plane query/action API and interactive ceremonies"
homepage = "https://netidx.github.io/netidx-book/"
repository = "https://github.com/estokes/netidx"
readme = "../README.md"
documentation = "https://docs.rs/graphix-package-netidx-admin"
keywords = ["networking", "distributed", "configuration"]
categories = ["network-programming"]

[dependencies]
anyhow = { workspace = true }
arcstr = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
compact_str = { workspace = true }
enumflags2 = { workspace = true }
futures = { workspace = true }
graphix-compiler = { workspace = true }
graphix-derive = { workspace = true }
graphix-package = { workspace = true }
graphix-package-core = { workspace = true }
graphix-package-array = { workspace = true }
graphix-package-str = { workspace = true }
graphix-package-json = { workspace = true }
graphix-package-tui = { workspace = true }
graphix-rt = { workspace = true }
chrono = { workspace = true }
netidx = { path = "../netidx", version = "0.32.0", default-features = false }
netidx-activation = { path = "../netidx-activation", version = "0.32.0" }
netidx-admin = { path = "../netidx-admin", version = "0.32.0" }
netidx-admin-proto = { path = "../netidx-admin-proto", version = "0.32.0" }
netidx-core = { path = "../netidx-core", version = "0.32.0" }
netidx-derive = { path = "../netidx-derive", version = "0.32.0" }
netidx-id-map = { path = "../netidx-id-map", version = "0.32.0" }
netidx-value = { path = "../netidx-value", version = "0.32.0" }
ahash = { workspace = true }
nohash = { workspace = true }
parking_lot = { workspace = true }
poolshark = { workspace = true }
tokio = { workspace = true }
triomphe = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
graphix-ast-pack = { workspace = true }

[dev-dependencies]
crossterm = { workspace = true }
env_logger = { workspace = true }
graphix-rt = { workspace = true }
graphix-package-tui = { workspace = true, features = ["testing"] }
netidx-admin = { path = "../netidx-admin", version = "0.32.0", features = ["testing"] }
tempfile = { workspace = true }
