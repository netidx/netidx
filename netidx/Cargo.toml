[package]
name = "netidx"
version = "0.32.0"
authors = ["Eric Stokes <letaris@gmail.com>"]
edition = "2024"
license = "MIT"
description = "Secure, fast, pub/sub messaging"
homepage = "https://netidx.github.io/netidx-book/"
repository = "https://github.com/estokes/netidx"
documentation = "https://docs.rs/netidx"
readme = "../README.md"
keywords = ["network", "networking", "distributed", "kerberos"]
categories = ["network-programming"]

[features]
default = []
krb5_iov = ["cross-krb5/iov"]

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dependencies]
anyhow = { workspace = true }
arcstr = { workspace = true }
bitflags = { workspace = true }
byteorder = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
cross-krb5 = { workspace = true }
ctrlc = { workspace = true }
derive_builder = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
nohash = { workspace = true }
ahash = { workspace = true }
if-addrs = { workspace = true }
immutable-chunkmap = { workspace = true }
indexmap = { workspace = true }
keyring = { workspace = true }
log = { workspace = true }
netidx-core = { version = "0.32.0", path = "../netidx-core" }
netidx-netproto = { version = "0.32.0", path = "../netidx-netproto" }
# TPM-sealed key passwords: `tls::load_key_password` reads `<key>.tpm`
# sidecars (machine-bound daemon credentials, no keychain required).
netidx-tpm = { version = "0.32.0", path = "../netidx-tpm" }
num_cpus = { workspace = true }
parking_lot = { workspace = true }
pkcs8 = { workspace = true }
poolshark = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
tempdir = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
triomphe = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }
