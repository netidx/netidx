[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false


[profile.dev]
opt-level = "s"
lto = "thin"
debug = true

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
arcstr = { version = "1", features = ["serde"] }
argon2 = "0.5"
arrayvec = "0.7.4"
base64 = "0.22"
bitflags = "2"
byteorder = "1"
bytes = { version = "1", features = ["serde"] }
cbindgen = "0.29"
chrono = { version = "^0.4.24", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
combine = "4"
compact_str = { version = "0.9", features = ["serde"] }
crossbeam = "0.8"
crossbeam-queue = "0.3"
cross-krb5 = { version = "0.5", default-features = false }
ctrlc = { version = "3", features = ["termination"] }
daemonize = "0.5"
derive_builder = "0.20"
digest = "0.11"
diligent-date-parser = "0.1.4"
dirs = "6"
enumflags2 = "0.7"
env_logger = "0.11"
escaping = "0.2.3"
extended-notify = "0.1"
fish-printf = "0.2.1"
fs3 = "0.5"
nohash = "0.2"
ahash = "0.8.12"
futures = "0.3"
globset = "0.4"
graphix-shell = { version = "0.9.0", path = "../graphix/graphix-shell", default-features = false }
graphix-rt = { version = "0.9.0", path = "../graphix/graphix-rt" }
graphix-compiler = { version = "0.9.0", path = "../graphix/graphix-compiler" }
graphix-package = { version = "0.9.0", path = "../graphix/graphix-package" }
graphix-package-core = { version = "0.9.0", path = "../graphix/stdlib/graphix-package-core" }
hdrhistogram = "7"
if-addrs = "0.15"
immutable-chunkmap = { version = "2.1.0", features = ["pool", "serde"] }
indexmap = "2"
keyring = "3"
log = "0.4"
# Conf-server discovery (netidx-conf `discovery` module): pure-Rust
# mDNS/DNS-SD — no avahi/Bonjour daemon dependency, works on Windows.
mdns-sd = "0.20"
memmap2 = "0.9"
nix = { version = "0.31", features = ["process", "signal"] }
num_cpus = "1"
once_cell = "1.17.2"
openssl = "0.10"
rpassword = "7"
packed_struct = "0.10"
packed_struct_codegen = "0.10"
parking_lot = "0.12.1"
pin-utils = "0.1"
poolshark = { version = "0.2.9" }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
proc-macro2 = "1"
proptest = "1"
quote = "1"
rand = "0.10"
rayon = "1"
rcgen = "0.14"
regex = "1"
reqwest = { version = "0.13", default-features = false }
rust_decimal = { version = "1", features = [
    "serde-with-float",
    "serde-with-str",
    "serde-with-arbitrary-precision",
] }
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
seq-macro = "0.3"
serde_derive = "1"
serde_json = "1"
serde = { version = "1", features = ["rc"] }
sha2 = "0.10"
sha3 = "0.11"
sled = { version = "0.34" }
smallvec = { version = "1", features = ["const_generics", "union"] }
syn = "2"
tempdir = "0.3.7"
tempfile = "3"
tokio-rustls = "0.26"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "fs",
    "sync",
    "process",
    "macros",
    "signal",
    "io-std",
] }
triomphe = { version = "0.1.15" }
uuid = { version = "1", features = ["v4", "serde"] }
warp = { version = "0.3", features = ["tls"] }
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
] }
x509-parser = "0.18"
zeroize = "1"
zstd = { version = "0.13", features = ["zstdmt"] }

[workspace]
resolver = "2"
members = [
    "netidx-core",
    "netidx-netproto",
    "netidx-value",
    "netidx",
    "netidx-archive",
    "netidx-protocols",
    "netidx-tools",
    "netidx-tools-core",
    "netidx-activation",
    "netidx-id-map",
    "netidx-conf",
    "netidx-container",
    "netidx-derive",
    "netidx-wsproxy",
    "netidx-ffi",
    "examples",
]
exclude = ["cfg/tls/id-win"]
